# pw-airplay configuration
#
# Apply changes with: systemctl --user restart pw-airplay-engine pw-airplay

# Seconds of silence after which the speakers are released, so other devices
# can use them. Audio resuming within this delay starts without reconnecting.
idle_timeout = 30

# Same, while the application reports it is paused. The speakers show the
# session as paused and it can be resumed from them meanwhile.
pause_timeout = 300

# How far ahead audio is scheduled on the speakers, in milliseconds. 2250 is
# what Apple senders use and works with every receiver. Lower values shorten
# the delay of system sounds; video stays in sync either way, since the
# latency is reported to applications.
start_buffer_ms = 2250

# Audio held in the engine's input buffer, absorbs scheduling jitter
pipe_start_buffer_ms = 100

# Added to the latency reported to applications. Positive if sound comes
# after the picture, negative if it comes before.
latency_offset_ms = 0

# Name of this computer on the speakers. Default: the pretty hostname, else
# the hostname.
#sender_name = Living room PC

# Send what is playing to the speakers, and take play/pause/next/previous
# from them. Needs a media player with MPRIS support.
now_playing = true

# An output playing to all speakers at once (computers are left out)
all_speakers_sink = true
all_speakers_name = All speakers

# Speakers to ignore, comma separated
#hide = Kitchen, Office

# Log level of the AirPlay engine: log, info or debug
#engine_log_level = log

# Groups of speakers, each becomes an output of its own, played in sync.
# Members are the names shown in the sound settings; a stereo pair counts as
# one speaker.
#[group "Downstairs"]
#members = Living room, Kitchen
